name: Scrape Berita ANTARA Harian

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install library yang dibutuhkan
        run: pip install -r requirements.txt

      - name: Jalankan script scraping
        run: python scrape_antara_rss_csv_harian.py

      - name: Simpan hasil CSV ke repo (commit otomatis)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.xlsx data/index.json
          git diff --staged --quiet || git commit -m "Update berita $(date +'%Y-%m-%d')"
          git push
