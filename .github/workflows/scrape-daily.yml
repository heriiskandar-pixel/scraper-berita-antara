name: Scrape Berita ANTARA Setiap Jam

# Kapan workflow ini jalan:
on:
  schedule:
    # Jalan tiap jam, di menit ke-0
    # (format cron: menit jam tanggal bulan hari-dalam-minggu)
    - cron: "0 * * * *"
  # Supaya bisa juga dijalankan manual kapan saja lewat tombol di tab "Actions"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install library yang dibutuhkan
        run: pip install -r requirements.txt
      - name: Install dependencies
        run: |
         python -m pip install --upgrade pip
         pip install -r requirements.txt

        

      - name: Jalankan script scraping
        run: python scrape_antara_rss_csv_harian.py

      - name: Simpan hasil ke repo (commit otomatis)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.xlsx data/index.json
          git diff --staged --quiet || git commit -m "Update berita $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
