<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Analisis Berita</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Prop-Types & Recharts CDN -->
  <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  
  <!-- Babel Standalone untuk JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid } = Recharts;

    // 1. Komponen Tombol Ekspor Excel (Dinamis Theme)
    const ExcelExportButton = ({ theme, onClick }) => {
      const isDark = theme === 'dark';

      return (
        <button 
          onClick={onClick}
          className={`flex items-center gap-2 px-4 py-2 rounded-lg font-medium transition-colors text-sm ${
            isDark 
              ? 'bg-emerald-950/60 text-emerald-400 hover:bg-emerald-900/80 border border-emerald-800/60' 
              : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200'
          }`}
        >
          <svg 
            className={`w-5 h-5 ${isDark ? 'fill-emerald-400' : 'fill-emerald-600'}`} 
            viewBox="0 0 24 24"
          >
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6zm10.2-7.2l-1.6 2.4 1.6 2.4h-1.7l-1-1.6-1 1.6h-1.7l1.6-2.4-1.6-2.4h1.7l1 1.5 1-1.5h1.7z"/>
          </svg>
          <span>Ekspor Excel</span>
        </button>
      );
    };

    // 2. Komponen KPI Cards
    const KPICards = ({ totalBerita, totalMedia, totalKategori }) => {
      const cards = [
        { title: 'Jumlah Berita', value: totalBerita, icon: '📰' },
        { title: 'Jumlah Media', value: totalMedia, icon: '🌐' },
        { title: 'Jumlah Kategori', value: totalKategori, icon: '🏷️' },
      ];

      return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          {cards.map((card, idx) => (
            <div 
              key={idx} 
              className="p-5 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-sm"
            >
              <div className="flex justify-between items-center">
                <span className="text-sm font-medium text-gray-500 dark:text-gray-400">
                  {card.title}
                </span>
                <span className="text-2xl">{card.icon}</span>
              </div>
              <div className="mt-2 text-3xl font-bold text-gray-900 dark:text-white">
                {card.value.toLocaleString('id-ID')}
              </div>
            </div>
          ))}
        </div>
      );
    };

    // 3. Custom Tooltip (Jumlah & Persentase)
    const CustomTooltip = ({ active, payload, label, totalData }) => {
      if (active && payload && payload.length) {
        const value = payload[0].value;
        const percentage = totalData > 0 ? ((value / totalData) * 100).toFixed(1) : 0;

        return (
          <div className="bg-gray-900 text-white p-3 rounded-lg shadow-lg border border-gray-700 text-xs">
            <p className="font-semibold text-gray-300 mb-1">{label}</p>
            <p className="text-emerald-400 font-bold">
              Jumlah: {value.toLocaleString('id-ID')} berita
            </p>
            <p className="text-gray-400 mt-0.5">
              Porsi: {percentage}% dari total
            </p>
          </div>
        );
      }
      return null;
    };

    // Komponen Reusable Bar Chart
    const NewsBarChart = ({ title, data, dataKey = "value", categoryKey = "name", color = "#10B981" }) => {
      const totalData = data.reduce((acc, curr) => acc + curr[dataKey], 0);

      return (
        <div className="p-5 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-sm">
          <h3 className="text-base font-semibold text-gray-800 dark:text-gray-100 mb-4">{title}</h3>
          <div className="h-64 w-full">
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={data} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" opacity={0.15} />
                <XAxis dataKey={categoryKey} stroke="#888888" fontSize={12} />
                <YAxis stroke="#888888" fontSize={12} />
                <Tooltip content={<CustomTooltip totalData={totalData} />} />
                <Bar dataKey={dataKey} fill={color} radius={[4, 4, 0, 0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      );
    };

    // 4. Utama App Component
    const App = () => {
      const [theme, setTheme] = useState('dark');

      const toggleTheme = () => {
        const newTheme = theme === 'dark' ? 'light' : 'dark';
        setTheme(newTheme);
        document.documentElement.classList.toggle('dark');
      };

      // Dummy Data
      const beritaPerHari = [
        { name: '01 Aug', value: 120 },
        { name: '02 Aug', value: 200 },
        { name: '03 Aug', value: 150 },
        { name: '04 Aug', value: 300 },
      ];

      const beritaPerMedia = [
        { name: 'Detik', value: 450 },
        { name: 'Kompas', value: 320 },
        { name: 'Tempo', value: 210 },
        { name: 'Antara', value: 180 },
      ];

      const beritaPerSentimen = [
        { name: 'Positif', value: 500 },
        { name: 'Netral', value: 350 },
        { name: 'Negatif', value: 150 },
      ];

      const beritaPerKategori = [
        { name: 'Politik', value: 400 },
        { name: 'Ekonomi', value: 300 },
        { name: 'Teknologi', value: 200 },
        { name: 'Hukum', value: 100 },
      ];

      return (
        <div className="p-6 max-w-7xl mx-auto">
          {/* Header */}
          <div className="flex justify-between items-center mb-6">
            <div>
              <h1 className="text-2xl font-bold text-gray-900 dark:text-white">Dashboard Analisis Berita</h1>
              <p className="text-sm text-gray-500 dark:text-gray-400">Ringkasan statistik media dan sentimen</p>
            </div>
            
            <div className="flex items-center gap-3">
              <button 
                onClick={toggleTheme} 
                className="px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-700 text-xs font-medium"
              >
                {theme === 'dark' ? '☀️ Light' : '🌙 Dark'}
              </button>
              <ExcelExportButton theme={theme} onClick={() => alert('Mengunduh Excel...')} />
            </div>
          </div>

          {/* KPI Cards */}
          <KPICards totalBerita={1000} totalMedia={25} totalKategori={8} />

          {/* 4 Grafik Berita (Bar All) */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <NewsBarChart title="Jumlah Berita Per Hari" data={beritaPerHari} color="#3B82F6" />
            <NewsBarChart title="Jumlah Berita Per Media" data={beritaPerMedia} color="#8B5CF6" />
            <NewsBarChart title="Jumlah Berita Per Sentimen" data={beritaPerSentimen} color="#10B981" />
            <NewsBarChart title="Jumlah Berita Per Kategori" data={beritaPerKategori} color="#F59E0B" />
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
