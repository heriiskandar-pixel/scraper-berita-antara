<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Berita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Dashboard Monitoring Berita</h1>
            <p class="text-gray-500 mt-1">Analisis dan statistik berita harian</p>
        </div>

        <div class="grid grid-cols-1 gap-6">
            
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="text-lg font-semibold text-gray-800">Jumlah Berita / Hari (Kalender Heat Map)</h2>
                        <p class="text-xs text-gray-500">Menampilkan jumlah berita harian dari hari ini mundur sampai sebulan lalu</p>
                    </div>
                </div>
                <div id="newsCalendarHeatmap" class="w-full h-72"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">Kategori Berita</h2>
                    <div class="relative h-64">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">Sentimen Berita</h2>
                    <div class="relative h-64">
                        <canvas id="sentimentChart"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Fungsi untuk mengambil/menyiapkan data 30 hari terakhir mundur dari hari ini
        function getRecent30DaysData() {
            const dates = [];
            const counts = [];
            const today = new Date();
            
            for (let i = 29; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(today.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                dates.push(dateStr);
                
                // Simulasi jumlah berita (bisa Anda ganti dengan data dari backend/database Anda)
                counts.push(Math.floor(Math.random() * 25));
            }
            return { dates, counts };
        }

        // Render Kalender Heat Map Interaktif
        function renderGrafikPerHari() {
            const dataHarian = getRecent30DaysData();
            
            let xValues = [];
            let yValues = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            let zValues = Array(7).fill(0).map(() => Array(dataHarian.dates.length).fill(0));
            let textValues = Array(7).fill(0).map(() => Array(dataHarian.dates.length).fill(''));

            dataHarian.dates.forEach((dateStr, index) => {
                const dateObj = new Date(dateStr);
                const dayOfWeek = dateObj.getDay(); // 0 (Minggu) s.d 6 (Sabtu)
                const count = dataHarian.counts[index];
                
                xValues.push(dateStr);
                zValues[dayOfWeek][index] = count;
                textValues[dayOfWeek][index] = `Tanggal: ${dateStr}<br>Jumlah Berita: ${count}`;
            });

            const trace = {
                z: zValues,
                x: dataHarian.dates,
                y: yValues,
                type: 'heatmap',
                colorscale: 'Blues',
                hoverongaps: false,
                text: textValues,
                hoverinfo: 'text',
                showscale: true
            };

            const layout = {
                margin: { t: 20, r: 20, l: 60, b: 40 },
                xaxis: { 
                    title: 'Tanggal',
                    tickangle: -30,
                    showgrid: false
                },
                yaxis: { 
                    autorange: 'reversed', 
                    showgrid: false 
                },
                font: { family: 'inherit' }
            };

            const config = { responsive: true, displayModeBar: false };

            Plotly.newPlot('newsCalendarHeatmap', [trace], layout, config);
        }

        // Render Grafik Lainnya (Chart.js)
        function renderOtherCharts() {
            // Chart Kategori
            const ctxCat = document.getElementById('categoryChart').getContext('2d');
            new Chart(ctxCat, {
                type: 'bar',
                data: {
                    labels: ['Politik', 'Ekonomi', 'Teknologi', 'Olahraga', 'Kriminal'],
                    datasets: [{
                        label: 'Jumlah',
                        data: [40, 25, 30, 20, 15],
                        backgroundColor: '#3b82f6',
                        borderRadius: 4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // Chart Sentimen
            const ctxSent = document.getElementById('sentimentChart').getContext('2d');
            new Chart(ctxSent, {
                type: 'doughnut',
                data: {
                    labels: ['Positif', 'Netral', 'Negatif'],
                    datasets: [{
                        data: [50, 30, 20],
                        backgroundColor: ['#10b981', '#f59e0b', '#ef4444']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // Jalankan fungsi saat halaman selesai dimuat
        window.addEventListener('DOMContentLoaded', () => {
            renderGrafikPerHari();
            renderOtherCharts();
        });
    </script>
</body>
</html>
