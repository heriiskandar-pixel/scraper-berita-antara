<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Berita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Dashboard Analisis Berita</h1>
            <p class="text-sm text-gray-500 mt-1">Monitoring jumlah dan tren berita secara real-time</p>
        </header>

        <div class="grid grid-cols-1 gap-8">
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4">
                    <div>
                        <h2 class="text-lg font-semibold text-gray-900">Kalender Heat Map Jumlah Berita</h2>
                        <p class="text-xs text-gray-500">Distribusi jumlah berita harian mundur hingga sebulan yang lalu</p>
                    </div>
                </div>
                <div id="newsCalendarHeatmap" class="w-full h-72"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Kategori Berita Teratas</h2>
                    <div class="relative h-64">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Sentimen Berita</h2>
                    <div class="relative h-64">
                        <canvas id="sentimentChart"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 1. Data Dummy / Generator Data untuk 30 Hari Terakhir (Bisa diganti dengan data dari backend/API Anda)
        function generateLast30DaysData() {
            const dates = [];
            const counts = [];
            const weekdays = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            
            const today = new Date();
            for (let i = 29; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(today.getDate() - i);
                
                // Format YYYY-MM-DD
                const dateStr = d.toISOString().split('T')[0];
                dates.push(dateStr);
                
                // Simulasi jumlah berita harian (random antara 0 s.d 25)
                counts.push(Math.floor(Math.random() * 25));
            }
            return { dates, counts };
        }

        const dataHarian = generateLast30DaysData();

        // 2. Render Kalender Heat Map menggunakan Plotly
        function renderCalendarHeatmap() {
            // Mengubah data harian menjadi format matrix untuk Heatmap (Hari dalam seminggu vs Minggu ke-)
            let xValues = [];
            let yValues = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            let zValues = Array(7).fill(0).map(() => Array(dataHarian.dates.length).fill(0));
            let textValues = Array(7).fill(0).map(() => Array(dataHarian.dates.length).fill(''));

            dataHarian.dates.forEach((dateStr, index) => {
                const dateObj = new Date(dateStr);
                const dayOfWeek = dateObj.getDay(); // 0 (Minggu) - 6 (Sabtu)
                const count = dataHarian.counts[index];
                
                xValues.push(dateStr);
                zValues[dayOfWeek][index] = count;
                textValues[dayOfWeek][index] = `Tanggal: ${dateStr}<br>Jumlah Berita: ${count}`;
            });

            const trace = {
                z: zValues,
                x: dataHarian.dates,
                y: yValues,
                type: 'heatmap',
                colorscale: 'Blues',
                hoverongaps: false,
                text: textValues,
                hoverinfo: 'text',
                showscale: true
            };

            const layout = {
                margin: { t: 20, r: 20, l: 60, b: 40 },
                xaxis: { 
                    title: 'Tanggal',
                    tickangle: -30,
                    showgrid: false
                },
                yaxis: { 
                    autorange: 'reversed', // Agar urutan Minggu di atas atau Senin di atas sesuai selera
                    showgrid: false 
                },
                font: { family: 'inherit' }
            };

            const config = { responsive: true, displayModeBar: false };

            Plotly.newPlot('newsCalendarHeatmap', [trace], layout, config);
        }

        // 3. Render Chart Pendukung (Contoh menggunakan Chart.js)
        function renderOtherCharts() {
            // Kategori Chart
            const ctxCat = document.getElementById('categoryChart').getContext('2d');
            new Chart(ctxCat, {
                type: 'bar',
                data: {
                    labels: ['Politik', 'Ekonomi', 'Teknologi', 'Olahraga', 'Kriminal'],
                    datasets: [{
                        label: 'Jumlah Berita',
                        data: [45, 30, 25, 20, 15],
                        backgroundColor: '#3b82f6',
                        borderRadius: 6
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // Sentimen Chart
            const ctxSent = document.getElementById('sentimentChart').getContext('2d');
            new Chart(ctxSent, {
                type: 'doughnut',
                data: {
                    labels: ['Positif', 'Netral', 'Negatif'],
                    datasets: [{
                        data: [55, 30, 15],
                        backgroundColor: ['#10b981', '#f59e0b', '#ef4444']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // Eksekusi saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            renderCalendarHeatmap();
            renderOtherCharts();
        });
    </script>
</body>
</html>
