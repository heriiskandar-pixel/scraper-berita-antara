<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analisis Berita & Sentimen AI</title>
    <!-- Library Eksternal -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }

        .kpi-title {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        /* Chart Grid Layout */
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .chart-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            height: 350px;
            position: relative;
        }

        .chart-title {
            font-size: 1rem;
            margin-bottom: 12px;
            font-weight: 600;
        }

        /* Controls / Filters */
        .controls-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .controls-panel input, 
        .controls-panel select, 
        .controls-panel button {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .controls-panel button {
            cursor: pointer;
            background-color: var(--accent-color);
            color: #000;
            font-weight: 600;
            border: none;
        }

        .controls-panel button.reset-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        /* Data View Options */
        .view-toggle {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        /* Table & Card View */
        .data-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }

        .cards-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .news-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
        }

        @media (max-width: 900px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Dashboard Analisis Berita & Sentimen AI</h1>
        <p style="color: var(--text-muted); margin: 0;">Visualisasi dan Filter Analisis Berita Interaktif</p>
    </header>

    <!-- KPI Cards -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-title">Total Berita</div>
            <div class="kpi-value" id="kpi-total">0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Jumlah Media</div>
            <div class="kpi-value" id="kpi-media">0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Jumlah Kategori</div>
            <div class="kpi-value" id="kpi-kategori">0</div>
        </div>
    </div>

    <!-- Chart Grid: Baris 1 (Hari & Sentimen), Baris 2 (Kategori & Media) -->
    <div class="chart-grid">
        <!-- Baris 1: Grafik 1 - Berita / Hari -->
        <div class="chart-card">
            <div class="chart-title">Jumlah Berita / Hari</div>
            <canvas id="chartHari"></canvas>
        </div>
        <!-- Baris 1: Grafik 2 - Sentimen -->
        <div class="chart-card">
            <div class="chart-title">Sentimen</div>
            <canvas id="chartSentimen"></canvas>
        </div>
        <!-- Baris 2: Grafik 3 - Kategori -->
        <div class="chart-card">
            <div class="chart-title">Kategori</div>
            <canvas id="chartKategori"></canvas>
        </div>
        <!-- Baris 2: Grafik 4 - Media -->
        <div class="chart-card">
            <div class="chart-title">Media</div>
            <canvas id="chartMedia"></canvas>
        </div>
    </div>

    <!-- Controls / Filters -->
    <div class="controls-panel">
        <input type="text" id="search-input" placeholder="Cari kata kunci...">
        
        <select id="filter-media">
            <option value="">Semua Media</option>
        </select>

        <select id="filter-sentimen">
            <option value="">Semua Sentimen</option>
        </select>

        <select id="filter-kategori">
            <option value="">Semua Kategori</option>
        </select>

        <button class="reset-btn" onclick="resetFilters()">Reset Filter</button>
        <button onclick="exportToExcel()">Ekspor ke Excel</button>

        <div class="view-toggle">
            <button onclick="switchView('table')">Tabel</button>
            <button onclick="switchView('cards')">Kartu</button>
        </div>
    </div>

    <!-- Data Display Container -->
    <div class="data-container">
        <div id="table-view">
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Judul Berita</th>
                        <th>Media</th>
                        <th>Kategori</th>
                        <th>Sentimen</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Data dimasukkan via JS -->
                </tbody>
            </table>
        </div>
        <div id="cards-view" class="cards-view" style="display: none;">
            <!-- Data kartu dimasukkan via JS -->
        </div>
    </div>
</div>

<script>
    let rawData = [];
    let filteredData = [];
    let charts = {};

    // Data Sampel untuk Pengujian (Bisa diganti dengan fetch asinkron dari index.json)
    const sampleData = [
        { Tanggal: '2026-03-01', Judul: 'Pengembangan AI di Indonesia', Media: 'Kompas', Kategori: 'Teknologi', Sentimen: 'Positif' },
        { Tanggal: '2026-03-01', Judul: 'Tantangan Etika Regulasi AI', Media: 'Detik', Kategori: 'Hukum', Sentimen: 'Netral' },
        { Tanggal: '2026-03-02', Judul: 'Inovasi AI Dalam Medis', Media: 'Tempo', Kategori: 'Kesehatan', Sentimen: 'Positif' },
        { Tanggal: '2026-03-02', Judul: 'Dampak Kebocoran Data AI', Media: 'Detik', Kategori: 'Keamanan', Sentimen: 'Negatif' },
        { Tanggal: '2026-03-02', Judul: 'Pasar Saham Sektor AI Naik', Media: 'Bisnis', Kategori: 'Ekonomi', Sentimen: 'Positif' },
        { Tanggal: '2026-03-03', Judul: 'Sektor Perbankan Pakai Bot AI', Media: 'Bisnis', Kategori: 'Ekonomi', Sentimen: 'Positif' },
        { Tanggal: '2026-03-03', Judul: 'Kritik Penggunaan AI di Sekolah', Media: 'Kompas', Kategori: 'Pendidikan', Sentimen: 'Negatif' },
        { Tanggal: '2026-03-03', Judul: 'AI Membantu Prediksi Cuaca', Media: 'Tempo', Kategori: 'Teknologi', Sentimen: 'Positif' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
        // Menggunakan data sampel (Ubah ke fetch jika membaca file external)
        rawData = [...sampleData];
        filteredData = [...rawData];

        populateDropdowns();
        updateDashboard();
    });

    // Helper Fungsi untuk Mengurutkan Data Grafik (Tertinggi di Atas)
    function getSortedChartData(countsObj) {
        const sorted = Object.entries(countsObj).sort((a, b) => b[1] - a[1]); // Descending
        return {
            labels: sorted.map(item => item[0]),
            values: sorted.map(item => item[1])
        };
    }

    // Opsi Konfigurasi Utama Chart.js (Horizontal Bar Chart)
    function createChartOptions(titleText, filterType) {
        return {
            indexAxis: 'y', // Mengubah menjadi grafik batang horizontal
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                x: {
                    beginAtZero: true,
                    ticks: { color: '#94a3b8' },
                    grid: { color: '#334155' }
                },
                y: {
                    ticks: { color: '#f8fafc' },
                    grid: { display: false }
                }
            },
            onClick: (e, elements) => {
                if (elements.length > 0) {
                    const index = elements[0].index;
                    const label = charts[filterType].data.labels[index];
                    applyChartFilter(filterType, label);
                }
            }
        };
    }

    function renderCharts() {
        // 1. Hitung Frekuensi Data
        const countsHari = {}, countsSentimen = {}, countsKategori = {}, countsMedia = {};

        filteredData.forEach(item => {
            countsHari[item.Tanggal] = (countsHari[item.Tanggal] || 0) + 1;
            countsSentimen[item.Sentimen] = (countsSentimen[item.Sentimen] || 0) + 1;
            countsKategori[item.Kategori] = (countsKategori[item.Kategori] || 0) + 1;
            countsMedia[item.Media] = (countsMedia[item.Media] || 0) + 1;
        });

        // 2. Urutkan Nilai Tertinggi ke Terendah
        const dataHari = getSortedChartData(countsHari);
        const dataSentimen = getSortedChartData(countsSentimen);
        const dataKategori = getSortedChartData(countsKategori);
        const dataMedia = getSortedChartData(countsMedia);

        // 3. Render / Update Chart.js
        updateOrCreateChart('chartHari', 'Hari', dataHari, '#38bdf8');
        updateOrCreateChart('chartSentimen', 'Sentimen', dataSentimen, '#34d399');
        updateOrCreateChart('chartKategori', 'Kategori', dataKategori, '#fbbf24');
        updateOrCreateChart('chartMedia', 'Media', dataMedia, '#f472b6');
    }

    function updateOrCreateChart(elementId, key, sortedData, color) {
        const ctx = document.getElementById(elementId).getContext('2d');
        
        if (charts[key]) {
            charts[key].data.labels = sortedData.labels;
            charts[key].data.datasets[0].data = sortedData.values;
            charts[key].update();
        } else {
            charts[key] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sortedData.labels,
                    datasets: [{
                        data: sortedData.values,
                        backgroundColor: color,
                        borderRadius: 4
                    }]
                },
                options: createChartOptions(key, key)
            });
        }
    }

    function updateKPIs() {
        document.getElementById('kpi-total').innerText = filteredData.length;
        document.getElementById('kpi-media').innerText = new Set(filteredData.map(d => d.Media)).size;
        document.getElementById('kpi-kategori').innerText = new Set(filteredData.map(d => d.Kategori)).size;
    }

    function renderTableAndCards() {
        const tbody = document.getElementById('table-body');
        const cardsView = document.getElementById('cards-view');
        
        tbody.innerHTML = '';
        cardsView.innerHTML = '';

        filteredData.forEach(item => {
            // Render Tabel
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.Tanggal}</td>
                <td>${item.Judul}</td>
                <td>${item.Media}</td>
                <td>${item.Kategori}</td>
                <td>${item.Sentimen}</td>
            `;
            tbody.appendChild(tr);

            // Render Kartu
            const card = document.createElement('div');
            card.className = 'news-card';
            card.innerHTML = `
                <div style="font-size: 0.8rem; color: var(--text-muted);">${item.Tanggal} | ${item.Media}</div>
                <h4 style="margin: 8px 0; color: var(--accent-color);">${item.Judul}</h4>
                <div style="font-size: 0.85rem;">Kategori: <strong>${item.Kategori}</strong></div>
                <div style="font-size: 0.85rem;">Sentimen: <strong>${item.Sentimen}</strong></div>
            `;
            cardsView.appendChild(card);
        });
    }

    function updateDashboard() {
        updateKPIs();
        renderCharts();
        renderTableAndCards();
    }

    // Filter Handlers
    document.getElementById('search-input').addEventListener('input', filterData);
    document.getElementById('filter-media').addEventListener('change', filterData);
    document.getElementById('filter-sentimen').addEventListener('change', filterData);
    document.getElementById('filter-kategori').addEventListener('change', filterData);

    function filterData() {
        const searchValue = document.getElementById('search-input').value.toLowerCase();
        const mediaValue = document.getElementById('filter-media').value;
        const sentimenValue = document.getElementById('filter-sentimen').value;
        const kategoriValue = document.getElementById('filter-kategori').value;

        filteredData = rawData.filter(item => {
            const matchSearch = item.Judul.toLowerCase().includes(searchValue);
            const matchMedia = !mediaValue || item.Media === mediaValue;
            const matchSentimen = !sentimenValue || item.Sentimen === sentimenValue;
            const matchKategori = !kategoriValue || item.Kategori === kategoriValue;

            return matchSearch && matchMedia && matchSentimen && matchKategori;
        });

        updateDashboard();
    }

    function applyChartFilter(type, value) {
        if (type === 'Media') document.getElementById('filter-media').value = value;
        if (type === 'Sentimen') document.getElementById('filter-sentimen').value = value;
        if (type === 'Kategori') document.getElementById('filter-kategori').value = value;
        filterData();
    }

    function resetFilters() {
        document.getElementById('search-input').value = '';
        document.getElementById('filter-media').value = '';
        document.getElementById('filter-sentimen').value = '';
        document.getElementById('filter-kategori').value = '';
        filteredData = [...rawData];
        updateDashboard();
    }

    function populateDropdowns() {
        const mediaList = [...new Set(rawData.map(d => d.Media))];
        const sentimenList = [...new Set(rawData.map(d => d.Sentimen))];
        const kategoriList = [...new Set(rawData.map(d => d.Kategori))];

        fillSelect('filter-media', mediaList);
        fillSelect('filter-sentimen', sentimenList);
        fillSelect('filter-kategori', kategoriList);
    }

    function fillSelect(id, items) {
        const select = document.getElementById(id);
        items.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item;
            opt.innerText = item;
            select.appendChild(opt);
        });
    }

    function switchView(viewType) {
        document.getElementById('table-view').style.display = viewType === 'table' ? 'block' : 'none';
        document.getElementById('cards-view').style.display = viewType === 'cards' ? 'grid' : 'none';
    }

    function exportToExcel() {
        const worksheet = XLSX.utils.json_to_sheet(filteredData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Hasil_Analisis");
        XLSX.writeFile(workbook, "Analisis_Berita_AI.xlsx");
    }
</script>

</body>
</html>
