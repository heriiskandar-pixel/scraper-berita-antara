<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analisis Berita & Sentimen AI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }

        .kpi-title {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .chart-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            height: 350px;
            position: relative;
        }

        .chart-title {
            font-size: 1rem;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .controls-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .controls-panel input, 
        .controls-panel select, 
        .controls-panel button {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .controls-panel button {
            cursor: pointer;
            background-color: var(--accent-color);
            color: #000;
            font-weight: 600;
            border: none;
        }

        .controls-panel button.reset-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .view-toggle {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        .data-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }

        .cards-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .news-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
        }

        @media (max-width: 900px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Dashboard Analisis Berita & Sentimen AI</h1>
    </header>

    <!-- Kartu KPI -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-title">Total Berita</div>
            <div class="kpi-value" id="kpi-total">0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Jumlah Media</div>
            <div class="kpi-value" id="kpi-media">0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Jumlah Kategori</div>
            <div class="kpi-value" id="kpi-kategori">0</div>
        </div>
    </div>

    <!-- Grid Grafik -->
    <div class="chart-grid">
        <!-- BARIS 1 -->
        <div class="chart-card">
            <div class="chart-title">Jumlah Berita / Hari</div>
            <canvas id="chartHari"></canvas>
        </div>
        <div class="chart-card">
            <div class="chart-title">Sentimen</div>
            <canvas id="chartSentimen"></canvas>
        </div>

        <!-- BARIS 2 -->
        <div class="chart-card">
            <div class="chart-title">Kategori</div>
            <canvas id="chartKategori"></canvas>
        </div>
        <div class="chart-card">
            <div class="chart-title">Media</div>
            <canvas id="chartMedia"></canvas>
        </div>
    </div>

    <!-- Panel Kontrol & Filter -->
    <div class="controls-panel">
        <input type="text" id="search-input" placeholder="Cari kata kunci...">
        
        <select id="filter-media">
            <option value="">Semua Media</option>
        </select>

        <select id="filter-sentimen">
            <option value="">Semua Sentimen</option>
        </select>

        <select id="filter-kategori">
            <option value="">Semua Kategori</option>
        </select>

        <button class="reset-btn" onclick="resetFilters()">Reset Filter</button>
        <button onclick="exportToExcel()">Ekspor ke Excel</button>

        <div class="view-toggle">
            <button onclick="switchView('table')">Tabel</button>
            <button onclick="switchView('cards')">Kartu</button>
        </div>
    </div>

    <!-- Tampilan Data -->
    <div class="data-container">
        <div id="table-view">
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Judul Berita</th>
                        <th>Media</th>
                        <th>Kategori</th>
                        <th>Sentimen</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        <div id="cards-view" class="cards-view" style="display: none;"></div>
    </div>
</div>

<script>
    let rawData = [];
    let filteredData = [];
    let charts = {};

    document.addEventListener('DOMContentLoaded', () => {
        // Mengambil data dari data/index.json
        fetch('data/index.json')
            .then(response => response.json())
            .then(data => {
                rawData = data;
                filteredData = [...rawData];
                populateDropdowns();
                updateDashboard();
            })
            .catch(error => console.error('Gagal memuat data:', error));
    });

    // Fungsi pengurutan agar nilai tertinggi selalu di posisi paling atas pada Horizontal Bar Chart
    function getSortedChartData(countsObj) {
        const sorted = Object.entries(countsObj).sort((a, b) => a[1] - b[1]); 
        return {
            labels: sorted.map(item => item[0]),
            values: sorted.map(item => item[1])
        };
    }

    function createChartOptions(filterType) {
        return {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                x: {
                    beginAtZero: true,
                    ticks: { color: '#94a3b8' },
                    grid: { color: '#334155' }
                },
                y: {
                    ticks: { color: '#f8fafc' },
                    grid: { display: false }
                }
            },
            onClick: (e, elements) => {
                if (elements.length > 0) {
                    const index = elements[0].index;
                    const label = charts[filterType].data.labels[index];
                    applyChartFilter(filterType, label);
                }
            }
        };
    }

    function renderCharts() {
        const countsHari = {}, countsSentimen = {}, countsKategori = {}, countsMedia = {};

        filteredData.forEach(item => {
            if (item.Tanggal) countsHari[item.Tanggal] = (countsHari[item.Tanggal] || 0) + 1;
            if (item.Sentimen) countsSentimen[item.Sentimen] = (countsSentimen[item.Sentimen] || 0) + 1;
            if (item.Kategori) countsKategori[item.Kategori] = (countsKategori[item.Kategori] || 0) + 1;
            if (item.Media) countsMedia[item.Media] = (countsMedia[item.Media] || 0) + 1;
        });

        updateOrCreateChart('chartHari', 'Hari', getSortedChartData(countsHari), '#38bdf8');
        updateOrCreateChart('chartSentimen', 'Sentimen', getSortedChartData(countsSentimen), '#34d399');
        updateOrCreateChart('chartKategori', 'Kategori', getSortedChartData(countsKategori), '#fbbf24');
        updateOrCreateChart('chartMedia', 'Media', getSortedChartData(countsMedia), '#f472b6');
    }

    function updateOrCreateChart(elementId, key, sortedData, color) {
        const ctx = document.getElementById(elementId).getContext('2d');
        
        if (charts[key]) {
            charts[key].data.labels = sortedData.labels;
            charts[key].data.datasets[0].data = sortedData.values;
            charts[key].update();
        } else {
            charts[key] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sortedData.labels,
                    datasets: [{
                        data: sortedData.values,
                        backgroundColor: color,
                        borderRadius: 4
                    }]
                },
                options: createChartOptions(key)
            });
        }
    }

    function updateKPIs() {
        document.getElementById('kpi-total').innerText = filteredData.length;
        document.getElementById('kpi-media').innerText = new Set(filteredData.map(d => d.Media).filter(Boolean)).size;
        document.getElementById('kpi-kategori').innerText = new Set(filteredData.map(d => d.Kategori).filter(Boolean)).size;
    }

    function renderTableAndCards() {
        const tbody = document.getElementById('table-body');
        const cardsView = document.getElementById('cards-view');
        
        tbody.innerHTML = '';
        cardsView.innerHTML = '';

        filteredData.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.Tanggal || ''}</td>
                <td>${item.Judul || ''}</td>
                <td>${item.Media || ''}</td>
                <td>${item.Kategori || ''}</td>
                <td>${item.Sentimen || ''}</td>
            `;
            tbody.appendChild(tr);

            const card = document.createElement('div');
            card.className = 'news-card';
            card.innerHTML = `
                <div style="font-size: 0.8rem; color: var(--text-muted);">${item.Tanggal || ''} | ${item.Media || ''}</div>
                <h4 style="margin: 8px 0; color: var(--accent-color);">${item.Judul || ''}</h4>
                <div style="font-size: 0.85rem;">Kategori: <strong>${item.Kategori || ''}</strong></div>
                <div style="font-size: 0.85rem;">Sentimen: <strong>${item.Sentimen || ''}</strong></div>
            `;
            cardsView.appendChild(card);
        });
    }

    function updateDashboard() {
        updateKPIs();
        renderCharts();
        renderTableAndCards();
    }

    document.getElementById('search-input').addEventListener('input', filterData);
    document.getElementById('filter-media').addEventListener('change', filterData);
    document.getElementById('filter-sentimen').addEventListener('change', filterData);
    document.getElementById('filter-kategori').addEventListener('change', filterData);

    function filterData() {
        const searchValue = document.getElementById('search-input').value.toLowerCase();
        const mediaValue = document.getElementById('filter-media').value;
        const sentimenValue = document.getElementById('filter-sentimen').value;
        const kategoriValue = document.getElementById('filter-kategori').value;

        filteredData = rawData.filter(item => {
            const matchSearch = !searchValue || (item.Judul && item.Judul.toLowerCase().includes(searchValue));
            const matchMedia = !mediaValue || item.Media === mediaValue;
            const matchSentimen = !sentimenValue || item.Sentimen === sentimenValue;
            const matchKategori = !kategoriValue || item.Kategori === kategoriValue;

            return matchSearch && matchMedia && matchSentimen && matchKategori;
        });

        updateDashboard();
    }

    function applyChartFilter(type, value) {
        if (type === 'Media') document.getElementById('filter-media').value = value;
        if (type === 'Sentimen') document.getElementById('filter-sentimen').value = value;
        if (type === 'Kategori') document.getElementById('filter-kategori').value = value;
        filterData();
    }

    function resetFilters() {
        document.getElementById('search-input').value = '';
        document.getElementById('filter-media').value = '';
        document.getElementById('filter-sentimen').value = '';
        document.getElementById('filter-kategori').value = '';
        filteredData = [...rawData];
        updateDashboard();
    }

    function populateDropdowns() {
        const mediaList = [...new Set(rawData.map(d => d.Media).filter(Boolean))];
        const sentimenList = [...new Set(rawData.map(d => d.Sentimen).filter(Boolean))];
        const kategoriList = [...new Set(rawData.map(d => d.Kategori).filter(Boolean))];

        fillSelect('filter-media', mediaList);
        fillSelect('filter-sentimen', sentimenList);
        fillSelect('filter-kategori', kategoriList);
    }

    function fillSelect(id, items) {
        const select = document.getElementById(id);
        items.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item;
            opt.innerText = item;
            select.appendChild(opt);
        });
    }

    function switchView(viewType) {
        document.getElementById('table-view').style.display = viewType === 'table' ? 'block' : 'none';
        document.getElementById('cards-view').style.display = viewType === 'cards' ? 'grid' : 'none';
    }

    function exportToExcel() {
        const worksheet = XLSX.utils.json_to_sheet(filteredData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Hasil_Analisis");
        XLSX.writeFile(workbook, "Analisis_Berita_AI.xlsx");
    }
</script>

</body>
</html>
